name: Update Prices (15-min)

on:
  schedule:
    # TWO-TIER SCHEDULE. Read this before changing it.
    #
    # GitHub runs `schedule` events best-effort and silently DROPS them under
    # load. Every dropped trigger still leaves the Actions tab all-green, so
    # cadence must be diagnosed from the SPACING OF COMMIT TIMESTAMPS, never
    # from the pass/fail column.
    #
    # Measured on this repo:
    #   - 15-min cron  (0,15,30,45): ~39% of slots fired.
    #   - hourly cron  (5 13..21):   2-3 of 9 fired per day through Sep 2026,
    #                                30-45 min late, so the first update of the
    #                                day landed 17:00-18:40 UTC against a 13:30
    #                                open, with 140-min mid-session blackouts.
    #
    # So we stop treating the trigger as the cadence mechanism. The trigger only
    # has to IGNITE the day; the job then generates 15-min granularity itself and
    # keeps going for hours (see "Run analyser on a 15-minute loop").
    #
    # Tier 1 - ignition. Four attempts an hour across the pre-open and first
    # hours of the session. At the measured ~39% hit rate, the chance all twelve
    # are dropped is negligible. Any one that lands starts the day.
    - cron: '2,17,32,47 13,14,15 * * 1-5'
    # Tier 2 - handoff/backstop. Picks the session back up if the whole morning
    # was dropped, and takes over from a run that has hit its 5h30m cap.
    - cron: '5 16,17,18,19,20,21 * * 1-5'
  workflow_dispatch:

concurrency:
  group: sp500-prices
  # A later trigger takes over from the run in flight. A fresh run scores on its
  # first iteration, so a takeover costs ~90s of setup and immediately resumes
  # the cadence. This is what makes the dense ignition tier safe.
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    # The loop self-limits to 5h30m (see MAX_RUN_SECONDS); GitHub hard-kills any
    # hosted job at 6h, so this ceiling sits between the two.
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run analyser on a 15-minute loop
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          INTERVAL=900          # 15 minutes
          MAX_RUN_SECONDS=19800 # 5h30m, under GitHub's 6h hard job limit
          END_HOUR_UTC=22       # covers the 21:00 UTC close under EST and 20:00 under EDT

          RUN_START=$(date +%s)
          i=0

          # TIME-bounded, not count-bounded. The old version ran a fixed 6
          # iterations (75 min) and then exited, so a day with two surviving
          # triggers produced two tight clusters and hours of silence between
          # them. Running until the close means ONE surviving trigger covers the
          # rest of the session on its own.
          while :; do
            i=$((i + 1))

            if [ "$(date -u +%H)" -ge "$END_HOUR_UTC" ]; then
              echo "Past ${END_HOUR_UTC}:00 UTC - session over, ending loop."
              break
            fi

            ELAPSED_TOTAL=$(( $(date +%s) - RUN_START ))
            if [ "$ELAPSED_TOTAL" -ge "$MAX_RUN_SECONDS" ]; then
              echo "Hit the 5h30m cap - exiting cleanly for the next hourly trigger to take over."
              break
            fi

            START=$(date +%s)
            echo "::group::Iteration $i at $(date -u '+%H:%M:%S UTC') (${ELAPSED_TOTAL}s into run)"

            if python sp500_analyser.py; then
              git add data.js data.json data_prev.js data_prev.json sp500_meta.json
              if git diff --cached --quiet; then
                echo "No data change - nothing to commit."
              else
                git commit -m "chore: update prices $(date -u '+%Y-%m-%d %H:%M UTC')"
                git pull --rebase origin master
                git push
              fi
            else
              # A single yfinance hiccup must not kill the remaining iterations.
              echo "::warning::Analyser failed on iteration $i - continuing to next slot."
              git reset
              git rebase --abort 2>/dev/null || true
              git checkout -- . 2>/dev/null || true
            fi
            echo "::endgroup::"

            ELAPSED=$(( $(date +%s) - START ))
            SLEEP=$(( INTERVAL - ELAPSED ))
            if [ "$SLEEP" -gt 0 ]; then
              echo "Sleeping ${SLEEP}s until next 15-min slot."
              sleep "$SLEEP"
            fi
          done
